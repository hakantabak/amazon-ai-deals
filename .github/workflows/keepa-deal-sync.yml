name: Keepa ASIN Radar & Nabstash Sync

on:
  schedule:
    - cron: '*/30 * * * *'  # Her 30 dakikada bir otomatik çalışır
  workflow_dispatch:        # Manuel test çalıştırma butonu

permissions:
  contents: write

jobs:
  keepa-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Çek
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları Yükle
        run: pip install requests

      - name: Keepa Radarını Çalıştır ve Nabstash'e İlet
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          NABSTASH_WEBHOOK_SECRET: ${{ secrets.NABSTASH_WEBHOOK_SECRET }}
        run: python scripts/fetch_deals.py

      - name: Radar Kayıtlarını Repoya İşle
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/ llms.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: Keepa ASIN radarı güncellendi" && git push)
